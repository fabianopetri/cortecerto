<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CorteCerto - Painel Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --vermelho:#C8102E;
      --marrom:#3D1A0E;
      --creme:#FAF7F2;
      --cinza:#777;
      --borda:#E8E4DF;
      --verde:#1A7A4A;
      --amarelo:#B7791F;
      --branco:#fff;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:var(--creme);
      color:var(--marrom);
    }
    .login {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:var(--marrom);
    }
    .box, .wrap {
      width:100%;
      max-width:1040px;
      margin:auto;
    }
    .card {
      background:var(--branco);
      border:1px solid var(--borda);
      border-radius:10px;
      padding:22px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }
    .login .card { max-width:420px; margin:auto; }
    h1, h2 { margin:0 0 14px; }
    label {
      display:block;
      font-size:12px;
      font-weight:bold;
      color:var(--cinza);
      margin:12px 0 5px;
      text-transform:uppercase;
    }
    input, select {
      width:100%;
      border:1px solid var(--borda);
      border-radius:8px;
      padding:11px;
      font-size:15px;
    }
    button {
      border:0;
      border-radius:8px;
      padding:10px 14px;
      font-weight:bold;
      cursor:pointer;
      background:var(--vermelho);
      color:white;
    }
    button.sec { background:var(--marrom); }
    button.ghost { background:transparent; color:var(--marrom); border:1px solid var(--borda); }
    .erro { display:none; color:var(--vermelho); margin-top:12px; font-size:14px; }
    header {
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding:18px 24px;
      background:var(--branco);
      border-bottom:1px solid var(--borda);
    }
    main { padding:24px; }
    .grid {
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
    }
    .metric {
      background:var(--branco);
      border:1px solid var(--borda);
      border-radius:10px;
      padding:16px;
    }
    .metric span { color:var(--cinza); font-size:12px; display:block; }
    .metric strong { font-size:26px; }
    .toolbar {
      display:flex;
      gap:10px;
      margin-bottom:14px;
      align-items:center;
    }
    table {
      width:100%;
      border-collapse:collapse;
      background:var(--branco);
      border:1px solid var(--borda);
      border-radius:10px;
      overflow:hidden;
    }
    th, td {
      text-align:left;
      padding:10px;
      border-bottom:1px solid var(--borda);
      font-size:14px;
      vertical-align:middle;
    }
    th { background:#f6f2eb; font-size:12px; text-transform:uppercase; color:var(--cinza); }
    tr:last-child td { border-bottom:0; }
    .badge {
      display:inline-block;
      border-radius:999px;
      padding:4px 8px;
      font-size:12px;
      font-weight:bold;
    }
    .ativo { color:var(--verde); background:#e8f5ee; }
    .bloqueado, .vencido { color:var(--vermelho); background:#fde8eb; }
    .vencendo { color:var(--amarelo); background:#fff3d6; }
    .acoes { display:flex; flex-wrap:wrap; gap:6px; }
    .acoes button { padding:7px 9px; font-size:12px; }
    .hidden { display:none !important; }
    @media (max-width: 760px) {
      .grid { grid-template-columns:1fr 1fr; }
      table, thead, tbody, th, td, tr { display:block; }
      thead { display:none; }
      tr { border-bottom:1px solid var(--borda); padding:10px; }
      td { border:0; padding:5px 0; }
      .toolbar { flex-direction:column; align-items:stretch; }
    }
  </style>
</head>
<body>
  <section id="login" class="login">
    <div class="card">
      <h1>CorteCerto Admin</h1>
      <p>Entre com o usuario administrador do Supabase Auth.</p>
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="username" />
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()" />
      <div style="margin-top:16px"><button onclick="entrar()" id="btn-login">Entrar</button></div>
      <div id="erro" class="erro"></div>
    </div>
  </section>

  <section id="painel" class="hidden">
    <header>
      <div>
        <h2>Painel administrativo</h2>
        <div id="admin-email" style="color:var(--cinza);font-size:13px"></div>
      </div>
      <button class="ghost" onclick="sair()">Sair</button>
    </header>
    <main class="wrap">
      <div class="grid">
        <div class="metric"><span>Total</span><strong id="m-total">0</strong></div>
        <div class="metric"><span>Ativas</span><strong id="m-ativas">0</strong></div>
        <div class="metric"><span>Vencendo</span><strong id="m-vencendo">0</strong></div>
        <div class="metric"><span>Bloqueadas/vencidas</span><strong id="m-bloq">0</strong></div>
      </div>

      <div class="toolbar">
        <input id="busca" placeholder="Buscar por loja ou e-mail" oninput="render()" />
        <select id="filtro" onchange="render()">
          <option value="todas">Todas</option>
          <option value="ativo">Ativas</option>
          <option value="vencendo">Vencendo</option>
          <option value="bloqueado">Bloqueadas/vencidas</option>
        </select>
        <button class="sec" onclick="carregarLojas()">Atualizar</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Loja</th>
            <th>E-mail</th>
            <th>Validade</th>
            <th>Status</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </main>
  </section>

  <script>
    const SUPA_URL = 'https://eehvkoqtzxiqydfuibfv.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlaHZrb3F0enhpcXlkZnVpYmZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTAzNzMsImV4cCI6MjA5NTY2NjM3M30.-_-gqTAywZxwDrVm7fumMPhrg7fk0q1t_Ig79NbqwjU';
    const db = supabase.createClient(SUPA_URL, SUPA_KEY);
    let lojas = [];

    function erro(msg) {
      const el = document.getElementById('erro');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function entrar() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Entrando...';

      const { error } = await db.auth.signInWithPassword({ email, password: senha });
      if (error) {
        erro('E-mail ou senha incorretos.');
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }

      const ok = await validarAdmin();
      btn.disabled = false; btn.textContent = 'Entrar';
      if (ok) abrirPainel();
    }

    async function validarAdmin() {
      const { data: userData } = await db.auth.getUser();
      if (!userData?.user) return false;

      const { data, error } = await db
        .from('admin_users')
        .select('auth_user_id,email')
        .eq('auth_user_id', userData.user.id)
        .maybeSingle();

      if (error || !data) {
        await db.auth.signOut();
        erro('Usuario autenticado, mas sem permissao de administrador.');
        return false;
      }

      document.getElementById('admin-email').textContent = data.email;
      return true;
    }

    async function abrirPainel() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('painel').classList.remove('hidden');
      await carregarLojas();
    }

    async function sair() {
      await db.auth.signOut();
      location.reload();
    }

    function statusLoja(loja) {
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      const validade = loja.validade ? new Date(loja.validade + 'T00:00:00') : null;
      if (loja.status === 'bloqueado') return 'bloqueado';
      if (validade && validade < hoje) return 'vencido';
      if (validade) {
        const diff = Math.ceil((validade - hoje) / 86400000);
        if (diff <= 5) return 'vencendo';
      }
      return 'ativo';
    }

    async function carregarLojas() {
      const { data, error } = await db
        .from('lojas')
        .select('id,nome,email,validade,status,criado_em')
        .order('criado_em', { ascending:false });

      if (error) {
        document.getElementById('linhas').innerHTML = `<tr><td colspan="5">Erro ao carregar: ${error.message}</td></tr>`;
        return;
      }
      lojas = data || [];
      render();
    }

    function render() {
      const busca = document.getElementById('busca').value.toLowerCase();
      const filtro = document.getElementById('filtro').value;
      const resumo = { total: lojas.length, ativo:0, vencendo:0, bloq:0 };

      lojas.forEach(l => {
        const st = statusLoja(l);
        if (st === 'ativo') resumo.ativo++;
        else if (st === 'vencendo') resumo.vencendo++;
        else resumo.bloq++;
      });

      document.getElementById('m-total').textContent = resumo.total;
      document.getElementById('m-ativas').textContent = resumo.ativo;
      document.getElementById('m-vencendo').textContent = resumo.vencendo;
      document.getElementById('m-bloq').textContent = resumo.bloq;

      const filtradas = lojas.filter(l => {
        const st = statusLoja(l);
        const passaBusca = !busca || `${l.nome} ${l.email}`.toLowerCase().includes(busca);
        const passaFiltro = filtro === 'todas'
          || (filtro === 'ativo' && st === 'ativo')
          || (filtro === 'vencendo' && st === 'vencendo')
          || (filtro === 'bloqueado' && ['bloqueado','vencido'].includes(st));
        return passaBusca && passaFiltro;
      });

      document.getElementById('linhas').innerHTML = filtradas.map(l => {
        const st = statusLoja(l);
        const validade = l.validade || '';
        return `<tr>
          <td><strong>${l.nome || '-'}</strong></td>
          <td>${l.email || '-'}</td>
          <td><input type="date" value="${validade}" onchange="salvarData('${l.id}', this.value)" /></td>
          <td><span class="badge ${st}">${st}</span></td>
          <td class="acoes">
            <button onclick="renovar('${l.id}',30)">+30 dias</button>
            <button class="sec" onclick="bloquear('${l.id}')">Bloquear</button>
            <button class="ghost" onclick="desbloquear('${l.id}')">Desbloquear</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="5">Nenhuma loja encontrada.</td></tr>';
    }

    async function salvarData(id, validade) {
      await db.from('lojas').update({ validade }).eq('id', id);
      await carregarLojas();
    }

    async function renovar(id, dias) {
      const loja = lojas.find(l => l.id === id);
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      const base = loja.validade && new Date(loja.validade + 'T00:00:00') > hoje
        ? new Date(loja.validade + 'T00:00:00')
        : hoje;
      base.setDate(base.getDate() + dias);
      const validade = base.toISOString().split('T')[0];
      await db.from('lojas').update({ validade, status:'ativo' }).eq('id', id);
      await carregarLojas();
    }

    async function bloquear(id) {
      if (!confirm('Bloquear o acesso desta loja?')) return;
      await db.from('lojas').update({ status:'bloqueado' }).eq('id', id);
      await carregarLojas();
    }

    async function desbloquear(id) {
      await db.from('lojas').update({ status:'ativo' }).eq('id', id);
      await carregarLojas();
    }

    window.addEventListener('load', async () => {
      const { data } = await db.auth.getSession();
      if (data.session && await validarAdmin()) abrirPainel();
    });
  </script>
</body>
</html>
